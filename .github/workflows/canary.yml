# The fleet member canary. This repo is a Claudinite member on the staging
# channel that takes its packs through the fleet manager canary
# (ClaudiniteCanaryFleetManager), whose signed directory it reads with
# CLAUDINITE_MANAGER_TOKEN, and updates its engine daily as the manager's
# directory asks of members. A Claudinite engine release dispatches it with
# the version it just published. It brings the packs up to date through the
# manager's directory, then runs this repo's ordinary engine update until
# that version lands. It passes when cn selftest --repo passes on the new
# main and cn check world reports no finding, deprecations aside, that it
# did not report before the update. When it fails, the report job opens a
# release-blocker issue naming the version in this repo, or comments on the
# one already open, which holds the release back from promotion to stable.
name: canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: The engine version to update to, MAJOR.YMMDD.BUILD
        required: true
        type: string

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      CLAUDINITE_MANAGER_TOKEN: ${{ secrets.CLAUDINITE_MANAGER_TOKEN }}
    steps:
      - name: the version is MAJOR.YMMDD.BUILD
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.YMMDD.BUILD, not \"$VERSION\""
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Every later git fetch and push needs the token.
          persist-credentials: true
      - name: download the pinned engine
        run: |
          { npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; }
      # An engine that has the installer-run update (cn update run) takes
      # engine and packs in one PR; an older one takes today's two updates.
      - name: which update the pinned engine runs
        id: flow
        run: |
          # cn with no command exits non-zero, which pipefail would carry.
          usage=$(.claudinite/bin/cn 2>&1 || true)
          if grep -q '^  update run ' <<< "$usage"; then
            echo new=true >> "$GITHUB_OUTPUT"
          else
            echo new=false >> "$GITHUB_OUTPUT"
          fi
      # The engine is judged against the packs as they are now: a pack fix
      # this repo has not taken would fail selftest and stop the engine
      # update before it starts.
      - name: update the packs
        if: steps.flow.outputs.new != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 30 * 60))
          pr=''
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ -n "$pr" ] && [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ]; then
              echo "#$pr merged"
              break
            fi
            verdict=$(.claudinite/bin/cn update packs | tail -n 1)
            echo "cn update packs: $verdict"
            case $verdict in
              "up to date" | "landed "*)
                break ;;
              "opened #"*)
                pr=${verdict#opened #}
                pr=${pr%% *} ;;
              "skipped: #"*" is open and its CI concluded "*)
                echo "::error::the pack update PR's CI is red: $verdict"
                exit 1 ;;
              "skipped: #"*" is open and "*)
                pr=${verdict#skipped: #}
                pr=${pr%% *} ;;
              "skipped: main has no CI run yet"* | "skipped: main is not green (queued)" | "skipped: main is not green (in_progress)" \
                | "skipped: main is not green (waiting)" | "skipped: main is not green (pending)" | "skipped: main is not green (requested)")
                ;;
              *)
                echo "::error::the pack update stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the packs had not landed after 30 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      # The findings, not the exit code, are what the run after the update
      # is compared with, so a failing check world here does not stop it.
      # They are taken on main as the pack update left it, so a finding the
      # new packs bring is not laid at the engine's door.
      - name: findings before the update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          git reset -q --hard FETCH_HEAD
          .claudinite/bin/cn check world > "$RUNNER_TEMP/before.txt" || true
          cat "$RUNNER_TEMP/before.txt"
      # Each cn update engine acts at most once: it waits for main's CI,
      # opens the update PR and starts its CI, or lands a green one. Its
      # PR's own CI run lands it too, so a merged PR ends the loop as well.
      - name: update the engine to the version
        if: steps.flow.outputs.new != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          listed=$((SECONDS + 10 * 60))
          pr=''
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ -n "$pr" ] && [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ]; then
              echo "#$pr merged"
              break
            fi
            verdict=$(.claudinite/bin/cn update engine | tee -a "$RUNNER_TEMP/update.log" | tail -n 1)
            echo "cn update engine: $verdict"
            case $verdict in
              "landed $VERSION")
                break ;;
              "up to date")
                if [ "$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)" = "$VERSION" ]; then
                  break
                fi
                # npm's package listing can lag the publish by minutes.
                if [ "$SECONDS" -lt "$listed" ]; then
                  echo "npm does not list $VERSION yet; trying again"
                else
                  echo "::error::cn update engine reports up to date, but main does not pin $VERSION"
                  exit 1
                fi ;;
              "opened #"*" for $VERSION")
                pr=${verdict#opened #}
                pr=${pr%% *} ;;
              *"agent stage"*)
                echo "::error::the update PR for $VERSION changes .github/workflows/, which only the engine/update task's agent stage may merge, and this canary runs none: $verdict"
                exit 1 ;;
              "skipped: #"*" for $VERSION is open and its CI concluded "*)
                echo "::error::the update PR's CI is red: $verdict"
                exit 1 ;;
              "skipped: #"*" for $VERSION is open and "*)
                pr=${verdict#skipped: #}
                pr=${pr%% *} ;;
              "skipped: main has no CI run yet"* | "skipped: main is not green (queued)" | "skipped: main is not green (in_progress)" \
                | "skipped: main is not green (waiting)" | "skipped: main is not green (pending)" | "skipped: main is not green (requested)")
                ;;
              *)
                echo "::error::the update to $VERSION stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$VERSION had not landed after 90 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      # The new engine's update opens one PR for engine and packs and never
      # merges it: GitHub's auto-merge does once its required check passes,
      # as this repo's merge level allows.
      - name: update through the installer
        if: steps.flow.outputs.new == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          listed=$((SECONDS + 10 * 60))
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ "$(sed -n 's/^  version: "\(.*\)"$/\1/p' .claudinite/settings.yaml | head -n 1)" = "$VERSION" ]; then
              echo "main pins $VERSION"
              break
            fi
            verdict=$(.claudinite/bin/cn update run | tee -a "$RUNNER_TEMP/update.log" | grep '^update: ' | tail -n 1)
            echo "cn update run: $verdict"
            case $verdict in
              "update: opened #"*"engine $VERSION"* | "update: refreshed #"*"engine $VERSION"* | "update: #"*"engine $VERSION"*" is open and current")
                pr=${verdict#update: }
                pr=${pr#opened }
                pr=${pr#refreshed }
                pr=${pr#\#}
                pr=${pr%% *}
                for _ in $(seq 20); do
                  [ "$(gh pr checks "$pr" --json name --jq length 2>/dev/null || echo 0)" -gt 0 ] && break
                  sleep 15
                done
                if ! gh pr checks "$pr" --watch --interval 30; then
                  echo "::error::the update PR #$pr's CI is red"
                  exit 1
                fi
                for _ in $(seq 20); do
                  [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ] && break
                  sleep 15
                done ;;
              "update: up to date")
                if [ "$SECONDS" -ge "$listed" ]; then
                  echo "::error::cn update run reports up to date, but main does not pin $VERSION"
                  exit 1
                fi
                echo "the channel does not list $VERSION yet; trying again" ;;
              *)
                echo "::error::the update to $VERSION stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$VERSION had not landed after 90 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      - name: main pins the version
        run: |
          git fetch -q origin main
          git reset -q --hard FETCH_HEAD
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::main pins $pinned after the update, not $VERSION"
            exit 1
          fi
      - name: cn selftest --repo
        run: .claudinite/bin/cn selftest --repo .
      # The new engine's own update, as its engine/update task runs it: the
      # installer finds the pin current and runs that engine's apply, here
      # writing nothing. An engine without apply ends the run here.
      - name: the installer's update on the new engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes @claudinite/setup@1 update --repo . --dry-run --json > "$RUNNER_TEMP/apply.json"
          cat "$RUNNER_TEMP/apply.json"
          to=$(jq -r .to "$RUNNER_TEMP/apply.json")
          if [ "$to" != "$VERSION" ]; then
            echo "::error::the installer's update ran an engine reporting $to, not $VERSION"
            exit 1
          fi
      # A finding is keyed by its class, check and path, the line up to its
      # sentence, so a sentence naming the engine version does not read as
      # new.
      - name: no new finding in cn check world
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/after.txt" || true
          cat "$RUNNER_TEMP/after.txt"
          # A run with no finding is a clean one, so grep matching nothing is no error.
          keys() { grep -E '^(break|finding|advisory) ' "$1" | sed 's/: .*//' | sort -u || true; }
          new=$(comm -13 <(keys "$RUNNER_TEMP/before.txt") <(keys "$RUNNER_TEMP/after.txt"))
          if [ -n "$new" ]; then
            echo "::error::cn check world on $VERSION reports findings it did not report before the update:"
            echo "$new"
            exit 1
          fi

  # The fleet manager canary's archive scenario needs history to import on
  # every release. The archive deletes the member's conversation-logs branch
  # once it holds every capture, so this job recreates it from the committed
  # fixtures when it is absent: four captures in three commits, the first
  # pruned from the tip so only the history holds it.
  seed:
    name: seed conversation-logs fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: seed the conversation-logs branch
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" conversation-logs > /dev/null; then
            echo "conversation-logs already exists; nothing to seed"
            exit 0
          fi
          fixtures="$PWD/.claudinite/canary-fixtures/conversation-logs"
          work=$(mktemp -d)
          cd "$work"
          git init -q -b conversation-logs
          git config user.name "claudinite-canary"
          git config user.email "canary@users.noreply.github.com"
          captures=("$fixtures"/*.jsonl)
          if [ "${#captures[@]}" -ne 4 ]; then
            echo "::error::expected four fixture captures, found ${#captures[@]}"
            exit 1
          fi
          cp "${captures[0]}" "${captures[1]}" .
          git add .
          git commit -q -m "fixture captures 1-2"
          cp "${captures[2]}" .
          git add .
          git commit -q -m "fixture capture 3"
          cp "${captures[3]}" .
          git rm -q "$(basename "${captures[0]}")"
          git add .
          git commit -q -m "fixture capture 4, capture 1 pruned"
          git push -q "$url" conversation-logs
          echo "seeded conversation-logs: $(git rev-list --count HEAD) commits, $(ls | wc -l) captures at the tip"

  # S-09 and S-12. The fleet manager's canary (S-08) gives this repo its key
  # secrets and commits the public half to main; the job after this one waits
  # for that file. No routine is configured here, so a growth-extract
  # hand-off ends at "could not start an agent session", which is the proof
  # the code-work reached the hand-off with a bundle.
  await-key:
    needs: canary
    if: ${{ !cancelled() && needs.canary.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: S-09 wait for the manager to commit the public key
        run: |
          deadline=$((SECONDS + 55 * 60))
          until gh api "repos/$GITHUB_REPOSITORY/contents/.claudinite/keys/conversation-logs.pub?ref=main" > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no .claudinite/keys/conversation-logs.pub on main: the fleet manager canary (S-08) did not run its fleet-history-keys step for this repo"
              exit 1
            fi
            sleep 30
          done
          echo "the public key is on main"

  growth:
    needs: [canary, await-key]
    if: ${{ !cancelled() && needs.await-key.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment:
      name: claudinite
      deployment: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH: encrypted-agent-sessions
      SESSION_HISTORY_KEY: ${{ secrets.SESSION_HISTORY_KEY }}
      REPO_ID: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: download the pinned engine and age
        run: |
          { npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; }
          sudo apt-get install -y --no-install-recommends age > /dev/null
      - name: S-09 close the items earlier runs left
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
              --jq '.[] | select(.title | startswith("[claudinite-work]")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
              --comment "Closed by the canary $VERSION before its growth scenario." > /dev/null
          done
      - name: S-09 the committed key is the one the secret derives
        run: |
          [ -n "$SESSION_HISTORY_KEY" ] || { echo "::error::SESSION_HISTORY_KEY is empty in the claudinite environment: the manager's S-08 step did not write it"; exit 1; }
          python3 scripts/derive_history_key.py "$REPO_ID" "$RUNNER_TEMP/derived.pub" "$RUNNER_TEMP/identity.txt"
          echo "::add-mask::$(tail -n 1 "$RUNNER_TEMP/identity.txt")"
          diff "$RUNNER_TEMP/derived.pub" .claudinite/keys/conversation-logs.pub || {
            echo "::error::the committed public key is not the one SESSION_HISTORY_KEY derives for this repository"
            exit 1
          }
      - name: S-09 a fixture session lands encrypted
        run: |
          git fetch --quiet origin "$BRANCH" 2> /dev/null && git ls-tree -r --name-only FETCH_HEAD | sort > "$RUNNER_TEMP/names-before" || : > "$RUNNER_TEMP/names-before"
          .claudinite/bin/cn growth capture --issue 0 --session "canary-member-$VERSION-$GITHUB_RUN_ID" \
            --transcript canary-fixtures/session.jsonl | tee "$RUNNER_TEMP/capture.txt"
          grep -q "on $BRANCH" "$RUNNER_TEMP/capture.txt" || { echo "::error::the capture did not report a file stored on $BRANCH"; exit 1; }
          git fetch --quiet origin "$BRANCH"
          files=$(git ls-tree -r --name-only FETCH_HEAD | grep -v '^README.md$')
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qv '\.age$'; then
            echo "::error::$BRANCH holds something that is not an .age file, or nothing: $files"
            exit 1
          fi
          if git grep -q 'canary-fixture-marker' FETCH_HEAD; then
            echo "::error::the fixture's text is readable on $BRANCH"
            exit 1
          fi
          f=$(git ls-tree -r --name-only FETCH_HEAD | sort | comm -13 "$RUNNER_TEMP/names-before" - | grep '\.age$' | head -n 1)
          [ -n "$f" ] || { echo "::error::$BRANCH gained no .age file from the capture"; exit 1; }
          git show "FETCH_HEAD:$f" | age -d -i "$RUNNER_TEMP/identity.txt" | gunzip | tail -n +2 | diff - canary-fixtures/session.jsonl || {
            echo "::error::the opened capture differs from the fixture"
            exit 1
          }
      - name: S-09 growth-extract bundles the session through the executor
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          created=$(.claudinite/bin/cn work create claudinite/growth-extract --qualifier "canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          echo "$created"
          number=$(sed -n 's/^created #\([0-9]*\) .*/\1/p' <<<"$created")
          [ -n "$number" ] || { echo "::error::cn work create did not report the item it filed"; exit 1; }
          echo "ITEM=$number" >> "$GITHUB_ENV"
          gh workflow run claudinite-executor.yml --repo "$GITHUB_REPOSITORY"
          deadline=$((SECONDS + 75 * 60))
          while :; do
            sleep 30
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name] | join(" ")')
            case " $labels " in
              *" task:status:needs-human-"* | *" task:status:running-agent "* | *" task:status:done "*) break ;;
              *" task:status:rejected "*) echo "::error::growth-extract #$number was rejected"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the deadline passed before growth-extract #$number reached its hand-off; it carries: $labels"
              exit 1
            fi
          done
          text=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .body; gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body')
          echo "$text" | grep -q 'captured session(s) are bundled for you' || {
            echo "::error::#$number does not say a bundle was made ('captured session(s) are bundled for you')"
            echo "$text"
            exit 1
          }
          found=
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/claudinite-executor.yml/runs?created=%3E%3D$started&per_page=20" --jq '.workflow_runs[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx "claudinite-growth-bundle-$number"; then
              found=$run
            fi
          done
          [ -n "$found" ] || { echo "::error::no executor run uploaded claudinite-growth-bundle-$number"; exit 1; }
          echo "run $found uploaded claudinite-growth-bundle-$number; #$number: $labels"
          grep -q 'Could not start an agent session' <<<"$text" || grep -q 'running-agent' <<<"$labels" || {
            echo "::error::#$number neither started an agent session nor said why it could not"
            exit 1
          }
          # The hand-off's own capture must not store anything: only canary captures exist.
          git fetch --quiet origin "$BRANCH"
          others=$(git ls-tree -r --name-only FETCH_HEAD | grep '\.age$' | grep -vc 'canary-' || true)
          echo "captures not named canary-: $others"
      - name: S-09 close the item
        if: ${{ always() && env.ITEM != '' }}
        run: |
          gh issue close "$ITEM" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Closed by the canary $VERSION." > /dev/null || true
      # S-12. The same job, with the checkout's public key file replaced by one that
      # is someone else's. The environment's secret is the real one, so the
      # code-work must refuse before it decrypts anything.
      - name: S-12 a swapped public key stops growth-extract and names both causes
        run: |
          age-keygen -o "$RUNNER_TEMP/other.key" 2> "$RUNNER_TEMP/other.pub.txt"
          other=$(sed -n 's/^Public key: //p' "$RUNNER_TEMP/other.pub.txt")
          printf '# repo %s\n%s\n' "$REPO_ID" "$other" > .claudinite/keys/conversation-logs.pub
          created=$(.claudinite/bin/cn work create claudinite/growth-extract --qualifier "canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-swap")
          echo "$created"
          number=$(sed -n 's/^created #\([0-9]*\) .*/\1/p' <<<"$created")
          [ -n "$number" ] || { echo "::error::cn work create did not report the item it filed"; exit 1; }
          echo "ITEM12=$number" >> "$GITHUB_ENV"
          export RUNNER_TEMP GITHUB_ENV
          .claudinite/bin/cn execute loop || true
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name] | join(" ")')
          text=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .body; gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body')
          echo "$labels"
          failed=0
          case " $labels " in
            *" task:status:needs-human-"*) ;;
            *) echo "::error::#$number was not parked for a person: $labels"; failed=1 ;;
          esac
          for phrase in 'is not the public key' 'the key file was changed' 'the secret was replaced'; do
            grep -q "$phrase" <<<"$text" || { echo "::error::the finding on #$number lacks: $phrase"; failed=1; }
          done
          grep -q 'are bundled for you' <<<"$text" && { echo "::error::a bundle was made under a swapped key"; failed=1; }
          [ "$failed" = 0 ] || { echo "$text"; exit 1; }
      - name: S-12 close the item
        if: ${{ always() && env.ITEM12 != '' }}
        run: |
          git checkout -- .claudinite/keys/conversation-logs.pub
          gh issue close "$ITEM12" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Closed by the canary $VERSION." > /dev/null || true

  report:
    needs: [canary, seed, await-key, growth]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update the release-blocker issue
        run: |
          title="Release $VERSION fails the fleet member canary"
          body="The fleet member canary failed for engine $VERSION: $RUN

          Promotion to stable skips $VERSION while this issue is open. Close it once the failure is understood and either fixed in a later release or judged not to block this one."
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Holds a release back from promotion to stable"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-blocker --state open --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | first | .number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label release-blocker --body "$body"
          fi
